<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>AO Intelligence</title>
  <link rel="icon" href="assets/favicon-ao.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1b5f56">
  <meta http-equiv="refresh" content="0;url=app.html">
  <script>
    (function () {
      var dest = "app.html";
      try {
        var raw = localStorage.getItem("ao-meta-v1");
        if (!raw) dest = "start.html";
        else {
          var m = JSON.parse(raw);
          if (!m || !m.dashboards || !m.dashboards.length) dest = "start.html";
        }
      } catch (e) {}
      location.replace(dest);
    })();
  </script>
</head>
<body>
  <p style="font:16px/1.4 system-ui,sans-serif;padding:2rem"><a href="app.html">Continue to AO Intelligence</a></p>
</body>
</html>
